version: "2"

sql:
  - engine: "mysql"

    schema: "schema.sql"
    queries: "query.sql"

    gen:
      go:
        package: "usersInternalMySQL"
        out: "internal"

        sql_package: "database/sql"

        emit_json_tags: true
        emit_pointers_for_null_types: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false

        overrides:
          - db_type: "json"
            go_type:
              import: "hidden-prompt-backend/pkg/utils"
              package: "utils"
              type: "JSONMap"

          - db_type: "datetime"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "timestamp"
            go_type:
              import: "time"
              type: "Time"