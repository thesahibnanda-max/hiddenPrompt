version: "2"

sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "query.sql"

    gen:
      go:
        package: "puzzlesInternalPSQL"
        out: "internal"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_pointers_for_null_types: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false

        overrides:
          - db_type: "jsonb"
            go_type:
              import: "github.com/devlibx/gox-base/v2"
              package: "gox"
              type: "StringObjectMap"
  
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgVectorGo"
              type: "Vector"